
name: Despliegue automatico a Surge

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Surge
        run: npm install --global surge

      - name: Publicar pagina web
        run: surge ./ --domain practica-surge-cambia-este-nombre.surge.sh --token "$SURGE_TOKEN"
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
